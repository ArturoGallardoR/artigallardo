<!-- ═════════ DESKTOP ═════════ -->
<div class="desktop" id="desktop">
  <ul class="icons" id="icons"></ul>

  <section class="win" id="winTerm" data-win="term" hidden>
    <header class="titlebar">
      <svg class="i" aria-hidden="true"><use href="#ic-term"/></svg>
      <span class="ttl" data-i18n="cmdTitle"></span>
      <button class="ctrl" data-act="min" data-i18n-aria="minimize"><svg aria-hidden="true"><use href="#g-min"/></svg></button>
      <button class="ctrl maxbtn" data-act="max" data-i18n-aria="maximize"><svg aria-hidden="true"><use href="#g-max"/></svg></button>
      <button class="ctrl close" data-act="close" data-i18n-aria="close"><svg aria-hidden="true"><use href="#g-close"/></svg></button>
    </header>
    <div class="toolbar" id="termToolbar" role="toolbar"></div>
    <!-- term-core is moved into the mobile Terminal page on small screens -->
    <div class="term-core" id="termCore">
      <main class="screen" id="screen">
        <div id="log" role="log" aria-live="polite" aria-relevant="additions"></div>
        <div class="prompt-line">
          <label for="cmd" id="ps1">C:\ARTI&gt;</label>
          <div class="field" id="field">
            <input id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
            <span class="mirror" id="mirror" aria-hidden="true"></span>
          </div>
        </div>
      </main>
    </div>
  </section>

  <section class="win" id="winEasy" data-win="easy" hidden>
    <header class="titlebar">
      <svg class="i" aria-hidden="true"><use href="#ic-profile"/></svg>
      <span class="ttl" data-i18n="easyTitle"></span>
      <button class="ctrl" data-act="min" data-i18n-aria="minimize"><svg aria-hidden="true"><use href="#g-min"/></svg></button>
      <button class="ctrl maxbtn" data-act="max" data-i18n-aria="maximize"><svg aria-hidden="true"><use href="#g-max"/></svg></button>
      <button class="ctrl close" data-act="close" data-i18n-aria="close"><svg aria-hidden="true"><use href="#g-close"/></svg></button>
    </header>
    <div class="addr">
      <button class="navbtn" id="easyBack" data-i18n-aria="back"><svg aria-hidden="true"><use href="#g-back"/></svg></button>
      <button class="navbtn" id="easyFwd" data-i18n-aria="forward"><svg aria-hidden="true"><use href="#g-fwd"/></svg></button>
      <div class="crumbs" id="crumbs"></div>
      <button class="langbtn" data-lang-toggle><span class="code" data-i18n="langCode"></span><span data-i18n="switchLang"></span></button>
    </div>
    <div class="toolbar" role="toolbar">
      <button class="tool" data-go="terminal"><svg class="i" aria-hidden="true"><use href="#ic-term"/></svg><span data-i18n="openTerminal"></span></button>
      <span class="sep" aria-hidden="true"></span>
      <button class="tool" data-go="contact"><svg class="i" aria-hidden="true"><use href="#ic-mail"/></svg><span data-i18n="contactMe"></span></button>
    </div>
    <div class="easy-body">
      <nav class="navpane" id="navpane"></nav>
      <main class="pane" id="easyPane" tabindex="-1"></main>
    </div>
  </section>
</div>

<nav class="taskbar" id="taskbar">
  <button class="start" id="start" aria-expanded="false" aria-controls="startmenu"><svg aria-hidden="true"><use href="#ic-orb"/></svg><span data-i18n="start"></span></button>
  <div class="tasks">
    <button class="task" data-task="term" hidden><svg class="i" aria-hidden="true"><use href="#ic-term"/></svg><span data-i18n="cmdTask"></span></button>
    <button class="task" data-task="easy" hidden><svg class="i" aria-hidden="true"><use href="#ic-profile"/></svg><span data-i18n="easyTask"></span></button>
  </div>
  <div class="tray">
    <button class="traylang" data-lang-toggle data-i18n="langCode"></button>
    <time class="clock"></time>
  </div>
</nav>

<div class="startmenu" id="startmenu" hidden>
  <div class="banner98" aria-hidden="true"><span><b>Arti</b>OS 98</span></div>
  <ul id="menuList" role="menu"></ul>
</div>

<aside class="balloon" id="balloon" role="status" hidden>
  <h2><svg class="i" aria-hidden="true"><use href="#ic-profile"/></svg><span data-i18n="balloonTitle"></span></h2>
  <p data-i18n="balloonText"></p>
  <button class="btn green" data-go="overview" data-balloon-cta><span data-i18n="openEasy"></span></button>
  <button class="x" id="balloonX" data-i18n-aria="dismiss"><svg aria-hidden="true"><use href="#g-close"/></svg></button>
</aside>

<div class="shutdown" id="shutdown" hidden tabindex="-1">
  <div><span data-i18n="safeOff"></span><small data-i18n="wake"></small></div>
</div>

<!-- ═════════ MOBILE ═════════ -->
<div class="phone" id="phone">
  <div class="statusbar">
    <span class="brand">ArtiOS <svg aria-hidden="true"><use href="#g-wifi"/></svg></span>
    <time class="clock"></time>
    <div class="seg" role="group" data-i18n-aria="language">
      <button data-set-lang="en" aria-pressed="true">EN</button>
      <button data-set-lang="es" aria-pressed="false">ES</button>
    </div>
  </div>

  <main class="home" id="home">
    <section class="glasscard" id="homeCard"></section>
    <ul class="appgrid" id="appgrid"></ul>
  </main>
  <nav class="dock" id="dock" data-i18n-aria="dock"><ul id="dockList"></ul></nav>

  <section class="mpage" id="mpage" hidden>
    <header class="navbar">
      <button class="backbtn" data-mback data-i18n="home"></button>
      <h1 id="mpageTitle"></h1>
      <span></span>
    </header>
    <div class="mpage-body" id="mpageBody"></div>
  </section>

  <section class="mpage mterm" id="mterm" hidden>
    <header class="navbar">
      <button class="backbtn" data-mback data-i18n="home"></button>
      <h1 data-i18n="terminal"></h1>
      <span></span>
    </header>
    <div class="mpage-body" id="mtermBody">
      <div class="chips-bar" id="chipsBar" role="toolbar"></div>
    </div>
  </section>
</div>
</body>
</html>
