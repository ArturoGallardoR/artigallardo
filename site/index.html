<!-- ═════════ DESKTOP (Windows 7 Aero) ═════════ -->
<div class="desktop" id="desktop">
  <ul class="icons" id="icons"></ul>

  <aside class="gadget" id="gadget">
    <svg class="clockface" id="clockface" viewBox="0 0 100 100" role="img"></svg>
  </aside>

  <section class="win" id="winTerm" data-win="term" hidden>
    <header class="titlebar">
      <svg class="i" aria-hidden="true"><use href="#ic-term"/></svg>
      <span class="ttl" id="termTitle"></span>
      <div class="caps">
        <button data-act="min" data-i18n-aria="minimize"><svg aria-hidden="true"><use href="#g-min"/></svg></button>
        <button data-act="max" data-i18n-aria="maximize"><svg aria-hidden="true"><use href="#g-max"/></svg></button>
        <button class="x" data-act="close" data-i18n-aria="close"><svg aria-hidden="true"><use href="#g-close"/></svg></button>
      </div>
    </header>
    <!-- terminal: a command prompt that runs the Setup Utility full-screen; moved into the phone's Terminal page on small screens -->
    <div class="term" id="termCore">
      <div class="shell" id="shell">
        <div id="log" role="log" aria-live="polite" aria-relevant="additions"></div>
        <div class="prompt-line">
          <label for="cmd" id="ps1">C:\Users\Arti&gt;</label>
          <div class="field" id="field">
            <input id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
            <span class="mirror" id="mirror" aria-hidden="true"></span>
          </div>
        </div>
      </div>
      <div class="setup" id="setup" tabindex="-1" hidden>
        <div class="su-top">
          <div class="su-title" data-i18n="setupTitle"></div>
          <div class="su-tabs" id="suTabs" role="tablist"></div>
        </div>
        <div class="su-body">
          <div class="su-left" id="suLeft"></div>
          <aside class="su-help"><div class="su-help-h" data-i18n="itemHelp"></div><p id="suHelp"></p><p class="su-hint" id="suHint"></p></aside>
        </div>
        <div class="su-keys" id="suKeys"></div>
      </div>
    </div>
  </section>

  <section class="win" id="winEasy" data-win="easy" hidden>
    <header class="titlebar">
      <svg class="i" aria-hidden="true"><use href="#ic-profile"/></svg>
      <span class="ttl" data-i18n="easyTitle"></span>
      <div class="caps">
        <button data-act="min" data-i18n-aria="minimize"><svg aria-hidden="true"><use href="#g-min"/></svg></button>
        <button data-act="max" data-i18n-aria="maximize"><svg aria-hidden="true"><use href="#g-max"/></svg></button>
        <button class="x" data-act="close" data-i18n-aria="close"><svg aria-hidden="true"><use href="#g-close"/></svg></button>
      </div>
    </header>
    <div class="addr">
      <button class="navbtn" id="easyBack" data-i18n-aria="back"><svg aria-hidden="true"><use href="#g-back"/></svg></button>
      <button class="navbtn" id="easyFwd" data-i18n-aria="forward"><svg aria-hidden="true"><use href="#g-fwd"/></svg></button>
      <div class="crumbs" id="crumbs"></div>
      <label class="esearch"><span class="sr-only" data-i18n="searchEasy"></span><input id="easySearch" type="search" autocomplete="off"><svg aria-hidden="true"><use href="#g-search"/></svg></label>
    </div>
    <div class="cmdbar" role="toolbar">
      <button class="cbtn" data-go="terminal"><svg class="i" aria-hidden="true"><use href="#ic-term"/></svg><span data-i18n="openTerminal"></span></button>
      <button class="cbtn" data-go="contact"><svg class="i" aria-hidden="true"><use href="#ic-mail"/></svg><span data-i18n="contactMe"></span></button>
      <button class="cbtn" data-lang-toggle><svg class="i" aria-hidden="true"><use href="#ic-globe"/></svg><span data-i18n="switchLang"></span></button>
    </div>
    <div class="easy-body">
      <nav class="navpane" id="navpane"></nav>
      <main class="pane" id="easyPane" tabindex="-1"></main>
    </div>
    <footer class="details" id="details"></footer>
  </section>
</div>

<nav class="taskbar" id="taskbar">
  <button class="orb" id="start" aria-expanded="false" aria-controls="startmenu" data-i18n-aria="start"><svg aria-hidden="true"><use href="#ic-orb"/></svg></button>
  <div class="tasks">
    <button class="task" data-task="easy" style="--glow: 90, 180, 255" data-i18n-aria="easyTask"><svg class="i" aria-hidden="true"><use href="#ic-profile"/></svg></button>
    <button class="task" data-task="term" style="--glow: 85, 255, 255" data-i18n-aria="cmdTitle"><svg class="i" aria-hidden="true"><use href="#ic-term"/></svg></button>
  </div>
  <div class="tray">
    <button class="traylang" data-lang-toggle data-i18n="langCode"></button>
    <div class="tray-time"><time class="clock"></time><span class="date"></span></div>
  </div>
  <button class="peekbtn" id="peek" data-i18n-aria="showDesktop"></button>
</nav>

<div class="startmenu" id="startmenu" hidden>
  <div class="sm-left">
    <ul class="sm-list" id="smList" role="menu"></ul>
    <label class="sm-search"><span class="sr-only" data-i18n="searchStart"></span><input id="smSearch" type="search" autocomplete="off"><svg aria-hidden="true"><use href="#g-search"/></svg></label>
  </div>
  <div class="sm-right">
    <div class="sm-avatar" aria-hidden="true"><svg><use href="#ic-orb"/></svg></div>
    <ul class="sm-links" id="smLinks"></ul>
    <button class="sm-shut" id="shutBtn"><span data-i18n="shutDown"></span><svg aria-hidden="true"><use href="#ic-power"/></svg></button>
  </div>
</div>

<aside class="balloon" id="balloon" role="status" hidden>
  <h2><svg class="i" aria-hidden="true"><use href="#ic-profile"/></svg><span data-i18n="balloonTitle"></span></h2>
  <p data-i18n="balloonText"></p>
  <button class="btn green" data-go="overview"><span data-i18n="openEasy"></span></button>
  <button class="x" id="balloonX" data-i18n-aria="dismiss"><svg aria-hidden="true"><use href="#g-close"/></svg></button>
</aside>

<div class="shutdown" id="shutdown" hidden tabindex="-1">
  <div class="sd-box"><span class="spinner" aria-hidden="true"></span><span data-i18n="shuttingDown"></span></div>
  <p class="sd-wake" data-i18n="wake"></p>
</div>

<!-- ═════════ MOBILE (early iPhone OS) ═════════ -->
<div class="phone" id="phone">
  <div class="statusbar">
    <span class="brand">ArtiOS <svg aria-hidden="true"><use href="#g-wifi"/></svg></span>
    <time class="clock"></time>
    <div class="seg" role="group" data-i18n-aria="language">
      <button data-set-lang="en" aria-pressed="true">EN</button>
      <button data-set-lang="es" aria-pressed="false">ES</button>
    </div>
  </div>

  <main class="home" id="home">
    <section class="glasscard" id="homeCard"></section>
    <ul class="appgrid" id="appgrid"></ul>
  </main>
  <nav class="dock" id="dock" data-i18n-aria="dock"><ul id="dockList"></ul></nav>

  <section class="mpage" id="mpage" hidden>
    <header class="navbar">
      <button class="backbtn" data-mback></button>
      <h1 id="mpageTitle"></h1>
      <button class="homebtn" data-mhome><svg aria-hidden="true"><use href="#g-home"/></svg></button>
    </header>
    <div class="mpage-body" id="mpageBody"></div>
  </section>

  <section class="mpage mterm" id="mterm" hidden>
    <header class="navbar">
      <button class="backbtn" data-mback></button>
      <h1 data-i18n="terminal"></h1>
      <button class="homebtn" data-mhome><svg aria-hidden="true"><use href="#g-home"/></svg></button>
    </header>
    <div class="mpage-body" id="mtermBody"></div>
  </section>

  <section class="lock" id="lock" hidden data-i18n-aria="lockScreen">
    <div class="lock-top"><time class="lock-time" id="lockTime"></time><span class="lock-date" id="lockDate"></span></div>
    <div class="lock-bottom">
      <div class="slider" id="slider">
        <span class="slider-label" data-i18n="slideToUnlock"></span>
        <button class="knob" id="knob" data-i18n-aria="unlock"><svg aria-hidden="true"><use href="#g-arrow"/></svg></button>
      </div>
    </div>
  </section>
</div>
</body>
</html>
