<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArtiOS 98 — Arti Gallardo</title>
<meta name="description" content="Arti Gallardo · IT & Automation Engineer / AI Systems. Portafolio en una terminal estilo Windows 98, versión Frutiger Aero.">
<!--
  Fonts:
  · Selawik (Microsoft, SIL OFL 1.1) — open Segoe UI substitute, the Vista/7 "Aero" voice.
  · WebPlus IBM VGA 8x16 — The Ultimate Oldschool PC Font Pack by VileR, int10h.org (CC BY-SA 4.0).
  Licences in assets/fonts/.

<link rel="preload" href="assets/wallpaper.webp" as="image">
<style>
@font-face { font-family: "Selawik"; src: url(assets/fonts/selawkl.woff2) format("woff2"); font-weight: 300; font-display: swap; }
@font-face { font-family: "Selawik"; src: url(assets/fonts/selawk.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Selawik"; src: url(assets/fonts/selawksb.woff2) format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Selawik"; src: url(assets/fonts/selawkb.woff2) format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "IBM VGA"; src: url(assets/fonts/WebPlus_IBM_VGA_8x16.woff) format("woff"); font-display: block; }

:root {
  --ui: "Selawik", "Segoe UI", Tahoma, system-ui, sans-serif;
  --dos: "IBM VGA", "Perfect DOS VGA 437", "Lucida Console", monospace;

  /* Aero chrome */
  --title-a: #0a4cb0;
  --title-b: #1f8ee6;
  --title-c: #7fd6ff;
  --glass-hi: rgba(255,255,255,.72);
  --glass-lo: rgba(196,232,255,.48);
  --edge-light: #ffffff;
  --edge-dark: rgba(18,60,118,.55);
  --ink: #0b2545;
  --sel: #1e88e5;
  --lime-a: #8fe04b;
  --lime-b: #2e9b1c;

  /* DOS 16-colour palette (CGA/VGA) */
  --c0: #000000; --c1: #0000AA; --c2: #00AA00; --c3: #00AAAA;
  --c4: #AA0000; --c5: #AA00AA; --c6: #AA5500; --c7: #AAAAAA;
  --c8: #555555; --c9: #5555FF; --cA: #55FF55; --cB: #55FFFF;
  --cC: #FF5555; --cD: #FF55FF; --cE: #FFFF55; --cF: #FFFFFF;
  --dos-bg: var(--c0);
  --dos-fg: var(--c7);
  --term-size: 16px;

  --taskbar: 44px;
  --ease: cubic-bezier(.2,.8,.2,1);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--ui); font-size: 14px; color: var(--ink);
  overflow: hidden; -webkit-font-smoothing: antialiased;
  background: #3aa6ee url(assets/wallpaper.webp) center / cover no-repeat;
  user-select: none;
}
button, select { font: inherit; color: inherit; }
button { cursor: default; }
:focus-visible { outline: 1px dotted var(--ink); outline-offset: 2px; }
::selection { background: var(--sel); color: #fff; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 1em; height: 1em; flex: none; }

/* ═════════ desktop ═════════ */
.desktop { position: fixed; inset: 0 0 var(--taskbar) 0; }
.icons {
  list-style: none; margin: 0; padding: 14px 8px;
  display: grid; grid-auto-flow: column; grid-template-rows: repeat(auto-fill, 96px);
  grid-auto-columns: 92px; gap: 4px; height: 100%; width: max-content;
}
.icon {
  width: 92px; height: 92px; padding: 6px 4px 4px; border: 1px solid transparent; border-radius: 3px; background: none;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  color: #fff; font-size: 13px; line-height: 1.15; text-align: center;
  text-shadow: 0 1px 2px rgba(0,25,60,.95), 0 0 8px rgba(0,40,90,.75);
}
.icon svg { width: 44px; height: 44px; filter: drop-shadow(0 3px 3px rgba(0,30,70,.35)); transition: transform 160ms var(--ease); }
.icon:hover { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.45); }
.icon:hover svg { transform: translateY(-1px); }
.icon[aria-pressed="true"] {
  background: linear-gradient(rgba(140,210,255,.45), rgba(60,150,230,.35));
  border-color: rgba(255,255,255,.85);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6);
}
.icon:focus-visible { outline: 1px dotted #fff; outline-offset: -4px; }

/* ═════════ window: Win98 skeleton, Aero glass skin ═════════ */
.win {
  position: absolute; display: flex; flex-direction: column; min-width: 320px; min-height: 240px;
  padding: 4px; border-radius: 8px 8px 5px 5px;
  background: linear-gradient(180deg, var(--glass-hi), var(--glass-lo) 40%, rgba(170,215,250,.55));
  backdrop-filter: blur(14px) saturate(1.5); -webkit-backdrop-filter: blur(14px) saturate(1.5);
  border: 1px solid rgba(255,255,255,.95);
  box-shadow:
    inset 1px 1px 0 var(--edge-light), inset -1px -1px 0 var(--edge-dark),
    0 22px 60px -12px rgba(0,35,85,.55), 0 3px 10px rgba(0,35,85,.3);
}
.win[hidden] { display: none; }
.win.max { inset: 0 !important; width: auto !important; height: auto !important; border-radius: 0; }

.titlebar {
  position: relative; height: 30px; flex: none; display: flex; align-items: center; gap: 7px;
  padding: 0 4px 0 8px; border-radius: 5px 5px 0 0; overflow: hidden;
  background: linear-gradient(90deg, var(--title-a), var(--title-b) 55%, var(--title-c));
  color: #fff; font-weight: 700; font-size: 14px; letter-spacing: .01em;
  text-shadow: 0 1px 2px rgba(0,20,60,.6);
  touch-action: none;
}
.titlebar::before { /* glossy upper half */
  content: ""; position: absolute; inset: 0 0 50% 0; pointer-events: none;
  background: linear-gradient(rgba(255,255,255,.5), rgba(255,255,255,.14));
}
.titlebar > * { position: relative; }
.titlebar .ttl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titlebar svg.i { font-size: 18px; }
.win.dragging .titlebar { cursor: grabbing; }

.ctrl {
  width: 28px; height: 21px; display: grid; place-items: center; padding: 0;
  border: 1px solid rgba(255,255,255,.85); border-radius: 3px;
  background: linear-gradient(#e9f6ff, #b7dcf7 48%, #94c8ef 52%, #c4e6ff);
  box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 rgba(20,70,140,.45), 0 1px 1px rgba(0,30,80,.3);
  color: var(--ink);
}
.ctrl svg { width: 10px; height: 10px; }
.ctrl:hover { background: linear-gradient(#f4fbff, #cfeaff 48%, #9fd6ff 52%, #d8f1ff); }
.ctrl:active { box-shadow: inset -1px -1px 0 #fff, inset 1px 1px 0 rgba(20,70,140,.55); }
.ctrl.close { margin-left: 3px; width: 40px; color: #fff; background: linear-gradient(#f2a08a, #d9512c 48%, #c03510 52%, #e47a4f); }
.ctrl.close:hover { background: linear-gradient(#ffb7a2, #ec6339 48%, #d6431a 52%, #f69064); }
.ctrl.close svg { filter: drop-shadow(0 1px 1px rgba(80,0,0,.5)); }

/* toolbar (the old MS-DOS prompt toolbar) */
.toolbar {
  flex: none; display: flex; align-items: center; gap: 2px; padding: 4px 4px;
  margin-top: 3px; overflow-x: auto; scrollbar-width: none;
  background: linear-gradient(rgba(255,255,255,.75), rgba(225,243,255,.6));
  border: 1px solid rgba(255,255,255,.9); border-bottom-color: rgba(20,70,140,.25); border-radius: 3px;
}
.toolbar::-webkit-scrollbar { display: none; }
.tool {
  flex: none; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px;
  border: 1px solid transparent; border-radius: 3px; background: none; color: var(--ink); white-space: nowrap;
}
.tool svg.i { font-size: 18px; }
.tool:hover { border-color: rgba(60,140,220,.7); background: linear-gradient(#f3fbff, #d3ecff 48%, #bfe2ff 52%, #dcf2ff); box-shadow: inset 0 1px 0 #fff; }
.tool:active, .tool[aria-current="true"] { border-color: rgba(30,100,190,.75); background: linear-gradient(#cfe7fb, #e7f5ff); box-shadow: inset 1px 1px 2px rgba(10,60,130,.3); }
.toolbar .sep { flex: none; width: 2px; height: 22px; margin: 0 5px; border-left: 1px solid rgba(20,70,140,.3); border-right: 1px solid #fff; }
.fontsel { display: inline-flex; align-items: center; gap: 6px; padding: 0 4px 0 6px; color: var(--ink); flex: none; }
.fontsel select {
  height: 24px; padding: 0 4px; border-radius: 0; color: var(--ink); background: #fff;
  border: 1px solid; border-color: #7a8ea6 #fff #fff #7a8ea6; box-shadow: inset 1px 1px 0 #3c4f66;
}

/* screen: sunken Win98 well, DOS inside */
.screen-wrap {
  flex: 1; min-height: 0; margin-top: 4px; position: relative;
  border: 2px solid; border-color: #5f7a99 #ffffff #ffffff #5f7a99;
  box-shadow: inset 1px 1px 0 #1d2b3b;
}
.screen-wrap::after { /* faint glass reflection over the CRT */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(170deg, rgba(255,255,255,.07), rgba(255,255,255,0) 32%);
}
.screen {
  position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain;
  background: var(--dos-bg); color: var(--dos-fg);
  font-family: var(--dos); font-size: var(--term-size); line-height: 1.25;
  padding: 10px 12px 40%; cursor: text; user-select: text;
  -webkit-font-smoothing: none; font-smooth: never;
  scrollbar-width: auto; scrollbar-color: #9fc9ee #dcefff;
  container-type: inline-size;
}
.screen::-webkit-scrollbar { width: 17px; }
.screen::-webkit-scrollbar-track { background: repeating-conic-gradient(#dcefff 0 25%, #f4faff 0 50%) 0 0 / 2px 2px; }
.screen::-webkit-scrollbar-thumb {
  background: linear-gradient(90deg, #cfe9ff, #9fd0f7 50%, #7ebcef 51%, #b9defb);
  border: 1px solid #fff; border-right-color: #3d6c9e; border-bottom-color: #3d6c9e; border-radius: 2px;
}

/* DOS text roles */
.screen p { margin: 0; }
.w { color: var(--cF); } .y { color: var(--cE); } .cy { color: var(--cB); } .g { color: var(--cA); }
.lb { color: var(--c9); } .dim { color: var(--c7); }
.todo { color: var(--cD); }
.blank { height: 1.25em; }
.entry + .entry, .boot + .entry { margin-top: 1.25em; }
.cmdline { color: var(--dos-fg); white-space: pre-wrap; word-break: break-all; }
.out { margin-top: .4em; }
.out > * + * { margin-top: 1.25em; }

.banner { line-height: 1; white-space: pre; font-size: clamp(5px, calc(100cqi / 68), var(--term-size)); color: var(--cB); }
.banner .s { color: var(--c9); }

fieldset.box {
  margin: 0; padding: .5em 1em .75em; min-width: 0;
  border: 4px double var(--c7);
}
fieldset.box > legend { padding: 0 .5ch; color: var(--cF); }
fieldset.box.hl { border-color: var(--cB); }
fieldset.box.hl > legend { color: var(--cB); }

.kv { display: grid; grid-template-columns: 15ch minmax(0, 1fr); column-gap: 1ch; row-gap: .25em; margin: 0; }
.kv dt { color: var(--c7); white-space: nowrap; overflow: hidden; }
.kv dt::after { content: " ................................"; color: var(--c8); }
.kv dd { margin: 0; color: var(--cF); }

ul.dos { list-style: none; margin: .4em 0 0; padding: 0; }
ul.dos li { padding-left: 3ch; position: relative; }
ul.dos li::before { content: "►"; position: absolute; left: 0; color: var(--cB); }
ul.dos b { color: var(--cF); font-weight: 400; }

.job + .job { margin-top: 1em; }
.job-h { color: var(--cE); }

/* clickable things inside DOS: inverse-video selection */
.run {
  font: inherit; background: none; border: 0; padding: 0 1ch; margin: 0; cursor: pointer;
  color: var(--cF); text-align: left;
}
.run::before { content: "["; color: var(--c7); margin-left: -1ch; }
.run::after { content: "]"; color: var(--c7); margin-right: -1ch; }
.run:hover, .run:focus-visible { background: var(--c7); color: var(--c0); outline: 0; }
.run.bare::before, .run.bare::after { content: none; }
.run.bare { padding: 0; }
.next { display: flex; flex-wrap: wrap; gap: .25em 3ch; }

.dir-row {
  display: grid; grid-template-columns: 13ch minmax(0, 1fr) minmax(0, 1fr); gap: 2ch;
  width: 100%; padding: 0 1ch; margin: 0 -1ch; font: inherit; color: var(--c7); background: none; border: 0; text-align: left; cursor: pointer;
}
.dir-row .f { color: var(--cF); white-space: pre; }
.dir-row .r { color: var(--cE); }
.dir-row:hover, .dir-row:focus-visible { background: var(--c3); color: var(--c0); outline: 0; }
.dir-row:hover *, .dir-row:focus-visible * { color: var(--c0); }
.listing { white-space: pre-wrap; }

.err { color: var(--cF); }

/* prompt */
.prompt-line { display: flex; margin-top: 1.25em; }
.prompt-line > label { white-space: pre; }
.field { position: relative; flex: 1; min-width: 0; }
.field input {
  position: absolute; inset: 0; width: 100%; opacity: 0; border: 0; padding: 0; margin: 0;
  font: inherit; font-size: max(16px, 1em); background: transparent; color: transparent;
}
.mirror { white-space: pre; color: var(--dos-fg); pointer-events: none; display: block; overflow: hidden; }
.caret { position: relative; }
.caret::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: .05em; height: .14em; min-width: 1ch;
  background: var(--dos-fg); animation: blink 1.06s steps(1) infinite;
}
.field:not(.focused) .caret::after { opacity: .45; animation: none; }
@keyframes blink { 50% { opacity: 0; } }

/* reveal: DOS printed line-by-line → stepped wipe */
.reveal { animation: wipe 260ms steps(8) both; }
@keyframes wipe { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }

/* ═════════ taskbar ═════════ */
.taskbar {
  position: fixed; left: 0; right: 0; bottom: 0; height: var(--taskbar); z-index: 50;
  display: flex; align-items: center; gap: 6px; padding: 0 6px 0 4px;
  background: linear-gradient(#7fd0ff 0, #2c93e4 48%, #1270cc 52%, #1a86dc 100%);
  border-top: 1px solid rgba(255,255,255,.9);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 -2px 10px rgba(0,40,100,.25);
  color: #fff;
}
.start {
  height: 34px; display: inline-flex; align-items: center; gap: 7px; padding: 0 14px 0 6px;
  border: 1px solid rgba(255,255,255,.85); border-radius: 4px 17px 17px 4px;
  background: linear-gradient(#8fdc55, #47b12a 46%, #1f7f0e 54%, #2f9418);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.75), 0 1px 3px rgba(0,40,0,.4);
  color: #fff; font-weight: 700; font-size: 15px; letter-spacing: .01em;
  text-shadow: 0 1px 2px rgba(10,60,0,.75);
}
.start:hover { filter: brightness(1.06) saturate(1.1); }
.start[aria-expanded="true"] { box-shadow: inset 1px 2px 3px rgba(10,60,0,.5); }
.start svg { width: 24px; height: 24px; }
.tasks { flex: 1; min-width: 0; display: flex; gap: 4px; padding-left: 6px; border-left: 1px solid rgba(0,40,100,.35); box-shadow: -1px 0 0 rgba(255,255,255,.4); height: 32px; }
.task {
  max-width: 220px; min-width: 0; flex: 0 1 220px; height: 32px; display: inline-flex; align-items: center; gap: 7px; padding: 0 10px;
  border: 1px solid rgba(255,255,255,.55); border-radius: 3px; color: #fff; text-shadow: 0 1px 1px rgba(0,30,80,.6);
  background: linear-gradient(rgba(255,255,255,.28), rgba(255,255,255,.08) 50%, rgba(255,255,255,0) 51%, rgba(255,255,255,.12));
}
.task span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task svg.i { font-size: 18px; }
.task:hover { background: linear-gradient(rgba(255,255,255,.4), rgba(255,255,255,.16) 50%, rgba(255,255,255,.06) 51%, rgba(255,255,255,.2)); }
.task[aria-pressed="true"] { background: linear-gradient(rgba(0,40,110,.35), rgba(0,40,110,.15)); box-shadow: inset 1px 1px 3px rgba(0,25,70,.55); }
.task[hidden] { display: none; }
.tray {
  height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 12px;
  border: 1px solid rgba(0,40,100,.3); border-right-color: rgba(255,255,255,.5); border-bottom-color: rgba(255,255,255,.5);
  border-radius: 3px; background: rgba(0,45,110,.18); font-size: 13px; text-shadow: 0 1px 1px rgba(0,30,80,.6);
}

/* start menu */
.startmenu {
  position: fixed; left: 4px; bottom: calc(var(--taskbar) + 2px); z-index: 60; width: 272px;
  display: flex; padding: 3px; border-radius: 6px 6px 3px 3px;
  background: linear-gradient(rgba(255,255,255,.9), rgba(215,238,255,.86));
  backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
  border: 1px solid #fff;
  box-shadow: inset -1px -1px 0 rgba(20,70,140,.4), 0 14px 40px -6px rgba(0,35,85,.55);
  transform-origin: bottom left;
  animation: menu-in 200ms var(--ease) both;
}
.startmenu[hidden] { display: none; }
@keyframes menu-in { from { opacity: 0; transform: translateY(8px) scaleY(.96); } }
.startmenu .banner98 {
  width: 30px; flex: none; border-radius: 4px 0 0 2px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px;
  background: linear-gradient(0deg, var(--title-a), var(--title-b) 60%, var(--title-c));
}
.startmenu .banner98 span {
  writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap;
  color: #fff; font-size: 21px; font-weight: 300; letter-spacing: .02em; text-shadow: 0 1px 2px rgba(0,20,60,.5);
}
.startmenu .banner98 b { font-weight: 700; }
.startmenu ul { list-style: none; margin: 0; padding: 2px 0; flex: 1; }
.startmenu li.rule { height: 2px; margin: 4px 6px; border-top: 1px solid rgba(20,70,140,.3); border-bottom: 1px solid #fff; }
.mi {
  width: 100%; display: flex; align-items: center; gap: 10px; padding: 6px 10px; min-height: 40px;
  border: 1px solid transparent; border-radius: 3px; background: none; text-align: left; color: var(--ink);
}
.mi svg.i { font-size: 28px; }
.mi small { display: block; color: #3f5d80; font-size: 12px; }
.mi:hover, .mi:focus-visible {
  outline: 0; color: #fff; border-color: rgba(255,255,255,.7); text-shadow: 0 1px 1px rgba(0,30,80,.5);
  background: linear-gradient(#5fc0fb, #2d93e6 50%, #1a7fd6 51%, #3aa2ee);
}
.mi:hover small, .mi:focus-visible small { color: #e6f4ff; }

/* window minimise/restore outline (Win98 zoom-rect) */
.zoomrect { position: fixed; z-index: 70; pointer-events: none; border: 2px solid rgba(255,255,255,.95); border-radius: 4px; box-shadow: 0 0 12px rgba(120,210,255,.9), inset 0 0 12px rgba(120,210,255,.6); }

/* shutdown */
.shutdown {
  position: fixed; inset: 0; z-index: 100; background: #000; display: grid; place-items: center; text-align: center; padding: 24px;
  font-family: var(--dos); font-size: 24px; line-height: 1.4; color: #FF8A00; -webkit-font-smoothing: none; cursor: pointer;
}
.shutdown[hidden] { display: none; }
.shutdown small { display: block; margin-top: 2em; font-size: 16px; color: var(--c7); }

/* ═════════ responsive ═════════ */
@media (max-width: 760px) {
  .icons { padding: 10px 4px; grid-auto-columns: 84px; }
  .icon { width: 84px; }
  .win { inset: 0 !important; width: auto !important; height: auto !important; border-radius: 0; padding: 3px; }
  .ctrl.maxbtn { display: none; }
  .tool .lbl-long { display: none; }
  .start span { display: none; }
  .start { padding: 0 10px 0 6px; }
  .screen { padding: 8px 8px 30%; }
  .kv { grid-template-columns: 1fr; }
  .kv dt::after { content: none; }
  .kv dd { margin-bottom: .4em; }
  .dir-row { grid-template-columns: 1fr; gap: 0; padding: .3em 1ch; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>

<!-- icon sprite (hidden via size, not display:none, so gradients still resolve) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd6ff"/><stop offset=".5" stop-color="#2b8fe0"/><stop offset="1" stop-color="#0b4fae"/></linearGradient>
    <linearGradient id="gAqua" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9f3ff"/><stop offset=".55" stop-color="#2cc0e8"/><stop offset="1" stop-color="#0a7fb8"/></linearGradient>
    <linearGradient id="gLime" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8ff9a"/><stop offset=".55" stop-color="#6fd034"/><stop offset="1" stop-color="#2a8d17"/></linearGradient>
    <linearGradient id="gFolderBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7cf57"/><stop offset="1" stop-color="#d69a12"/></linearGradient>
    <linearGradient id="gFolderFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2b0"/><stop offset=".5" stop-color="#ffd54f"/><stop offset="1" stop-color="#eaa915"/></linearGradient>

        <button class="dir-row" data-cmd="open ${p.slug}" aria-label="Abrir ${esc(p.title)}">
          <span class="f">${p.file.padEnd(8)} TXT</span><span>${p.title}</span><span class="r">${p.result}</span>
        </button>`).join('')}
      <div class="blank"></div>
      <p class="dim">REM Haz clic en un archivo o escribe: open firmas</p>
    </div>`,

  open: ([slug]) => {
    const p = PROJECTS.find(x => x.slug === (slug || '').toLowerCase() || x.file === (slug || '').toUpperCase().replace(/\.TXT$/, ''));
    if (!p) return `<p class="err">${slug ? `No se encuentra el archivo ${esc(slug.toUpperCase())}.TXT` : 'Falta el nombre del proyecto. Ejemplo: open firmas'}</p>${next(['projects', 'Ver proyectos'])}`;
    return `
      <fieldset class="box hl"><legend> ${p.file}.TXT </legend>
        <p class="w">${p.title}</p>
        <p class="y">${p.result}.</p>
        <div class="blank"></div>
        <dl class="kv">
          <dt>Contexto</dt><dd>${p.context}</dd>
          <dt>Decisión</dt><dd>${p.decision}</dd>
          <dt>Mi rol</dt><dd>${TODO('qué hice yo exactamente')}</dd>
          <dt>Tradeoff</dt><dd>${p.tradeoff}</dd>
          <dt>Stack</dt><dd>${p.stack}</dd>
        </dl>
      </fieldset>
      ${next(['projects', '◄ Volver'], ...PROJECTS.filter(x => x !== p).slice(0, 2).map(x => [`open ${x.slug}`, x.file + '.TXT']))}`;
  },

  skills: () => `
    <fieldset class="box"><legend> SKILLS.TXT </legend>
      <dl class="kv">${SKILLS.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    </fieldset>
    <p class="dim">REM Sin barras de porcentaje: el nivel se demuestra en ${btn('projects', 'PROYECTO')}</p>`,

  education: () => `
    <fieldset class="box"><legend> EDUCACIO.TXT </legend>
      <dl class="kv">${EDUCATION.map(([y, t, o]) => `<dt>${y}</dt><dd>${t}<br><span class="dim">${o}</span></dd>`).join('')}
        <dt>Idiomas</dt><dd>Español: nativo<br>Inglés: B2, comunicación profesional y lectura técnica</dd>
      </dl>
    </fieldset>`,

  about: () => `
    <fieldset class="box"><legend> ACERCA.TXT </legend>
      <p class="w">Rigor técnico. Energía humana.</p>
      <p>${TODO('párrafo personal en tu voz')}</p>
      <div class="blank"></div>
      <dl class="kv">
        <dt>En el trabajo</dt><dd>Sistemas y arquitectura · automatización e integraciones · costo y mantenimiento · operación real</dd>
        <dt>Fuera de él</dt><dd>Música y baile · cine y series · videojuegos · buena conversación</dd>
      </dl>
    </fieldset>`,

  contact: () => `
    <fieldset class="box hl"><legend> CONTACTO.TXT </legend>
      <p class="w">Si tienes fricción operativa, hablemos.</p>
      <div class="blank"></div>
      <dl class="kv">
        <dt>Correo</dt><dd>${TODO('correo@dominio.com')}</dd>
        <dt>LinkedIn</dt><dd>${TODO('linkedin.com/in/...')}</dd>
        <dt>CV (PDF)</dt><dd>${TODO('enlace')}</dd>
      </dl>
    </fieldset>`,

  ver: () => `<p class="w">ArtiOS 98 [Versión 4.10.1998]</p><p class="dim">Fuentes: Selawik (Microsoft, OFL) · IBM VGA 8x16 por VileR, int10h.org (CC BY-SA 4.0).</p>`,

  dir: ([arg]) => {
    const target = arg ? arg.toUpperCase().replace(/^\\?ARTI\\?/, '').replace(/\\$/, '') : state.cwd;
    const list = DIRS[target];
    if (!list) return `<p class="err">No se encuentra el directorio ${esc(arg)}</p>`;
    const now = new Date();
    const date = now.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: '2-digit' });
    const time = now.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: false });
    const files = list.filter(f => !f.dir);
    const sizes = files.map(f => byteSize(f.cmd));
    const total = sizes.reduce((a, b) => a + b, 0);
    const rows = list.map(f => {
      const isDir = !!f.dir;
      const size = isDir ? '<DIR>'.padEnd(10) : fmtNum(sizes[files.indexOf(f)]).padStart(10);
      const label = `${f.name.padEnd(8)} ${(f.ext || '').padEnd(3)}  ${size}  ${date}  ${time}`;
      const cmd = isDir ? `cd ${f.name}` : f.cmd;
      return `<button class="dir-row listing" style="display:block" data-cmd="${cmd}">${esc(label)}</button>`;
    });
    const parent = target ? `<button class="dir-row listing" style="display:block" data-cmd="cd ..">${esc('..'.padEnd(13) + '<DIR>')}</button>` : '';
    const dirs = list.filter(f => f.dir).length + (target ? 1 : 0);
    return `<div class="listing"> El volumen de la unidad C es ARTI
 Directorio de C:\\ARTI${target ? '\\' + target : ''}

</div>${parent}${rows.join('')}<div class="listing">${String(files.length).padStart(9)} archivo(s)  ${fmtNum(total).padStart(10)} bytes
${String(dirs).padStart(9)} directorio(s)</div>`;
  },

  cd: ([arg]) => {
    if (!arg) return `<p>${esc(promptText().slice(0, -1))}</p>`;
    const a = arg.toUpperCase();
    if (a === '..' || a === '\\' || a === '\\ARTI') { state.cwd = ''; return ''; }
    const d = a.replace(/^\\?ARTI\\/, '').replace(/\\$/, '');
    if (DIRS[d] && d) { state.cwd = d; return ''; }
    return `<p class="err">Directorio no válido</p>`;
  },

  type: ([arg]) => {
    if (!arg) return `<p class="err">Falta un parámetro requerido. Ejemplo: type experien.txt</p>`;
    const f = findFile(arg);
    if (!f) return `<p class="err">No se encuentra el archivo ${esc(arg.toUpperCase())}</p>`;
    if (f.dir) return `<p class="err">Acceso denegado: ${f.name} es un directorio. Prueba: cd ${f.name.toLowerCase()}</p>`;
    if (f.ext === 'EXE') return `<p class="err">${f.name}.EXE es un programa. Escribe ${f.name.toLowerCase()} para ejecutarlo.</p>${next([f.cmd])}`;
    const [n, ...a] = f.cmd.split(' ');
    return COMMANDS[n](a);
  },

  color: ([code]) => {
    const scr = $('#screen');
    if (!code) { scr.style.removeProperty('--dos-bg'); scr.style.removeProperty('--dos-fg'); return ''; }
    const m = /^([0-9a-f])([0-9a-f])$/i.exec(code);
    if (!m) return `<p class="err">Uso: color XY  (X = fondo, Y = texto, dígitos hex 0-F). Ejemplo: color 1F</p>`;
    if (m[1].toUpperCase() === m[2].toUpperCase()) return `<p class="err">El fondo y el texto no pueden ser del mismo color.</p>`;
    scr.style.setProperty('--dos-bg', `var(--c${m[1].toUpperCase()})`);
    scr.style.setProperty('--dos-fg', `var(--c${m[2].toUpperCase()})`);
    return '';
  },

  sudo: (args) => args.join(' ').toLowerCase() === 'hire arti'
    ? `<p class="g">Permiso concedido.</p>${next(['contact', 'Continuar en CONTACTO'])}`
    : `<p class="err">Comando o nombre de archivo incorrecto. (¿Probaste "sudo hire arti"?)</p>`,
};
const ALL = [...Object.keys(COMMANDS), 'cls', 'exit'];

/* ═════════ terminal engine ═════════ */
const screen = $('#screen'), log = $('#log'), input = $('#cmd'), mirror = $('#mirror'), field = $('#field'), ps1 = $('#ps1');

function renderMirror() {
  const v = input.value, pos = input.selectionStart ?? v.length;
  mirror.replaceChildren(document.createTextNode(v.slice(0, pos)), h('span', 'caret', v[pos] || '\u00a0'), document.createTextNode(v.slice(pos + 1)));
}
function closest(word) {
  const d = (a, b) => { const m = Array.from({ length: a.length + 1 }, (_, i) => [i]); for (let j = 1; j <= b.length; j++) m[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) m[i][j] = Math.min(m[i-1][j] + 1, m[i][j-1] + 1, m[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)); return m[a.length][b.length]; };
  const best = ALL.map(c => [c, d(word, c)]).sort((a, b) => a[1] - b[1])[0];
  return best && best[1] <= 2 ? best[0] : null;
}
function print(promptStr, cmdText, html, { reveal = true } = {}) {
  const entry = h('section', 'entry');
  entry.append(h('div', 'cmdline', promptStr + cmdText));
  if (html) { const out = h('div', reveal && !reduce ? 'out reveal' : 'out'); out.append(frag(html)); entry.append(out); }
  log.append(entry);
  return entry;
}
function setActive(name) {
  document.querySelectorAll('[data-nav]').forEach(b => b.setAttribute('aria-current', String(b.dataset.nav === name)));
}
function scrollToEntry(entry) {
  const top = entry.getBoundingClientRect().top - screen.getBoundingClientRect().top + screen.scrollTop - 6;
  screen.scrollTo({ top, behavior: reduce ? 'auto' : 'smooth' });
}

function execute(raw) {
  const text = raw.trim();
  const before = promptText();
  if (text) state.history.push(text);
  state.hIdx = state.history.length;
  if (!text) { print(before, '', ''); ps1.textContent = promptText(); return; }

  const [head, ...args] = text.split(/\s+/);
  const lower = head.toLowerCase();
  const name = ALIASES[lower] || lower;

  if (name === 'cls') { log.replaceChildren(); setActive(null); return; }
  if (name === 'exit') { print(before, text, ''); Win.close(); return; }

  let html;
  if (COMMANDS[name]) html = COMMANDS[name](args);
  else {
    const file = findFile(head);
    if (file && !file.dir) { const [n, ...a] = file.cmd.split(' '); html = COMMANDS[n](a); }
    else {
      const guess = closest(name);
      html = `<p class="err">Comando o nombre de archivo incorrecto</p>` + (guess ? next([guess, `¿Quisiste decir ${guess.toUpperCase()}?`]) : next(['help', 'Ver AYUDA']));
    }
  }
  const entry = print(before, text, html);
  ps1.textContent = promptText();
  setActive(NAV.some(n => n.cmd === name) ? name : name === 'open' ? 'projects' : null);
  scrollToEntry(entry);
}

async function typeAndRun(cmd) {
  Win.open();
  if (state.busy) return;
  state.busy = true; state.skip = false;
  input.value = '';
  for (const ch of cmd) {
    input.value += ch; input.setSelectionRange(input.value.length, input.value.length); renderMirror();
    if (!reduce && !state.skip) await sleep(26 + Math.random() * 34);
  }
  if (!reduce && !state.skip) await sleep(140);
  execute(cmd);
  input.value = ''; renderMirror();
  state.busy = false;
  if (!mobile()) input.focus({ preventScroll: true });
}

function complete() {
  const v = input.value, low = v.toLowerCase();
  const sp = low.indexOf(' ');
  let pool;
  if (sp > 0) {
    const verb = ALIASES[low.slice(0, sp)] || low.slice(0, sp);
    const names = verb === 'open' ? PROJECTS.map(p => p.slug)
      : verb === 'cd' ? ['..', ...Object.keys(DIRS).filter(Boolean).map(s => s.toLowerCase())]
      : verb === 'type' ? (DIRS[state.cwd] || []).filter(f => !f.dir).map(f => `${f.name}.${f.ext}`.toLowerCase()) : [];
    pool = names.map(n => v.slice(0, sp + 1) + n);
  } else pool = ALL;
  const hits = pool.filter(c => c.toLowerCase().startsWith(low));
  if (hits.length === 1) input.value = hits[0];
  else if (hits.length > 1) {
    const prefix = hits.reduce((a, b) => { let i = 0; while (i < a.length && a[i].toLowerCase() === b[i]?.toLowerCase()) i++; return a.slice(0, i); });
    if (prefix.length > v.length) input.value = prefix;
    else print(promptText(), v, `<div class="next">${hits.map(x => btn(x, esc(x.split(' ').pop()), 'run bare')).join('')}</div>`, { reveal: false });
  }
  input.setSelectionRange(input.value.length, input.value.length);
  renderMirror();
}

input.addEventListener('keydown', (e) => {
  if (state.busy) { if (e.key === 'Escape') state.skip = true; e.preventDefault(); return; }
  if (e.key === 'Enter') { e.preventDefault(); const v = input.value; input.value = ''; execute(v); renderMirror(); }
  else if (e.key === 'Tab') { e.preventDefault(); complete(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (state.hIdx === state.history.length) state.draft = input.value; if (state.hIdx > 0) input.value = state.history[--state.hIdx]; renderMirror(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); if (state.hIdx < state.history.length) { state.hIdx++; input.value = state.history[state.hIdx] ?? state.draft; } renderMirror(); }
  else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); execute('cls'); }
  requestAnimationFrame(renderMirror);
});
['input', 'select', 'click', 'keyup'].forEach(ev => input.addEventListener(ev, renderMirror));
input.addEventListener('focus', () => field.classList.add('focused'));
input.addEventListener('blur', () => field.classList.remove('focused'));
screen.addEventListener('click', (e) => {
  if (!e.target.closest('button') && !String(getSelection()).length) input.focus({ preventScroll: true });
});
$('#fontSize').addEventListener('change', (e) => { screen.style.setProperty('--term-size', e.target.value + 'px'); input.focus({ preventScroll: true }); });

/* any [data-cmd] (output links, toolbar, start menu) types & runs */
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-cmd]');
  if (!b || b.closest('.icons')) return;
  Menu.close();
  typeAndRun(b.dataset.cmd);
});

/* ═════════ window manager ═════════ */
const Win = (() => {
  const win = $('#win'), task = $('#task'), bar = $('#titlebar');
  let open = true, minimized = false, maxed = false;

  function place() {
    if (mobile()) return;
    const W = innerWidth, H = innerHeight - 44;
    const w = Math.min(1000, W - 140), hgt = Math.min(700, H - 40);
    Object.assign(win.style, { width: w + 'px', height: hgt + 'px', left: Math.max(118, (W - w) / 2 + 50) + 'px', top: Math.max(16, (H - hgt) / 2 - 6) + 'px' });
  }
  function zoom(fromEl, toEl) {
    if (reduce) return Promise.resolve();
    const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
    const z = h('div', 'zoomrect'); document.body.append(z);
    const k = (r) => ({ left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
    return z.animate([k(a), k(b)], { duration: 240, easing: 'cubic-bezier(.2,.8,.2,1)' }).finished.then(() => z.remove());
  }
  function sync() { task.hidden = !open; task.setAttribute('aria-pressed', String(open && !minimized)); }

  async function minimize() {
    if (minimized) return;
    await zoom(win, task); win.hidden = true; minimized = true; sync();
  }
  async function restore() {
    if (!minimized) return;
    win.hidden = false; win.style.visibility = 'hidden';
    await zoom(task, win); win.style.visibility = ''; minimized = false; sync();
    if (!mobile()) input.focus({ preventScroll: true });
  }
  function close() { win.hidden = true; open = false; minimized = false; sync(); }
  async function openWin() {
    if (!open) { open = true; minimized = true; sync(); task.hidden = false; await restore(); }
    else if (minimized) await restore();
  }
  function toggleMax() { maxed = !maxed; win.classList.toggle('max', maxed); $('#btnMax').setAttribute('aria-label', maxed ? 'Restaurar' : 'Maximizar'); }

  $('#btnMin').addEventListener('click', minimize);
  $('#btnMax').addEventListener('click', toggleMax);
  $('#btnClose').addEventListener('click', close);
  task.addEventListener('click', () => minimized ? restore() : minimize());
  bar.addEventListener('dblclick', (e) => { if (!e.target.closest('button') && !mobile()) toggleMax(); });

  /* drag by title bar */
  bar.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || e.target.closest('button') || maxed || mobile()) return;
    const sx = e.clientX, sy = e.clientY, ox = win.offsetLeft, oy = win.offsetTop;
    bar.setPointerCapture(e.pointerId); win.classList.add('dragging');
    const move = (ev) => {
      const x = Math.min(innerWidth - 120, Math.max(120 - win.offsetWidth, ox + ev.clientX - sx));
      const y = Math.min(innerHeight - 44 - 30, Math.max(0, oy + ev.clientY - sy));
      win.style.left = x + 'px'; win.style.top = y + 'px';
    };
    const up = () => { bar.removeEventListener('pointermove', move); win.classList.remove('dragging'); };
    bar.addEventListener('pointermove', move);
    bar.addEventListener('pointerup', up, { once: true });
    bar.addEventListener('pointercancel', up, { once: true });
  });

  place();
  addEventListener('resize', () => { if (!maxed) place(); });
  return { open: openWin, close, minimize };
})();

/* ═════════ desktop icons: click selects, double-click (or Enter / tap) opens ═════════ */
(() => {
  const icons = $('#icons');
  const items = [{ cmd: 'help', label: 'Terminal', icon: 'ic-term' }, ...NAV];
  icons.replaceChildren(...items.map(it => {
    const li = h('li'), b = h('button', 'icon');
    b.dataset.run = it.cmd; b.setAttribute('aria-pressed', 'false');
    b.append(frag(`<svg aria-hidden="true"><use href="#${it.icon}"/></svg>`), h('span', null, it.label));
    li.append(b); return li;
  }));
  let lastPointer = 'mouse';
  const select = (b) => icons.querySelectorAll('.icon').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  icons.addEventListener('pointerdown', (e) => { lastPointer = e.pointerType; });
  icons.addEventListener('click', (e) => {
    const b = e.target.closest('.icon'); if (!b) return;
    select(b);
    if (e.detail === 0 || lastPointer === 'touch') typeAndRun(b.dataset.run);   // keyboard Enter or touch tap
  });
  icons.addEventListener('dblclick', (e) => { const b = e.target.closest('.icon'); if (b) typeAndRun(b.dataset.run); });
  $('#desktop').addEventListener('pointerdown', (e) => { if (!e.target.closest('.icon') && !e.target.closest('.win')) select(null); });
})();

/* ═════════ toolbar ═════════ */
$('#toolbar').append(...[...NAV.slice(0, 5), { cmd: 'contact', label: 'Contacto', icon: 'ic-mail' }, { cmd: 'cls', label: 'Limpiar', icon: 'ic-clear' }, { cmd: 'help', label: 'Ayuda', icon: 'ic-help' }]
  .filter((it, i, arr) => arr.findIndex(x => x.cmd === it.cmd) === i)
  .map(it => {
    const b = h('button', 'tool'); b.dataset.cmd = it.cmd; if (NAV.some(n => n.cmd === it.cmd)) b.dataset.nav = it.cmd;
    b.title = it.cmd;
    b.append(frag(`<svg class="i" aria-hidden="true"><use href="#${it.icon}"/></svg>`), h('span', it.cmd === 'cls' || it.cmd === 'help' ? 'lbl-long' : null, it.label));
    return b;
  }));

/* ═════════ start menu ═════════ */
const Menu = (() => {
  const menu = $('#startmenu'), start = $('#start'), list = $('#menuList');
  const item = (it) => { const li = h('li'); li.setAttribute('role', 'none'); const b = h('button', 'mi'); b.setAttribute('role', 'menuitem');
    if (it.cmd) b.dataset.cmd = it.cmd; if (it.id) b.id = it.id;
    b.append(frag(`<svg class="i" aria-hidden="true"><use href="#${it.icon}"/></svg>`));
    const t = h('span', null, it.label); if (it.desc) t.append(h('small', null, it.desc)); b.append(t); li.append(b); return li; };
  const rule = () => { const li = h('li', 'rule'); li.setAttribute('role', 'separator'); return li; };
  list.replaceChildren(...NAV.map(item), rule(), item({ cmd: 'help', label: 'Ayuda', icon: 'ic-help' }), rule(), item({ id: 'shutBtn', label: 'Apagar el sistema...', icon: 'ic-power' }));

  const close = () => { menu.hidden = true; start.setAttribute('aria-expanded', 'false'); };
  const open = () => { menu.hidden = false; start.setAttribute('aria-expanded', 'true'); list.querySelector('.mi').focus(); };
  start.addEventListener('click', () => menu.hidden ? open() : close());
  document.addEventListener('pointerdown', (e) => { if (!menu.hidden && !e.target.closest('#startmenu, #start')) close(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { state.skip = true; if (!menu.hidden) { close(); start.focus(); } }
    if (!menu.hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      e.preventDefault();
      const all = [...list.querySelectorAll('.mi')], i = all.indexOf(document.activeElement);
      all[(i + (e.key === 'ArrowDown' ? 1 : -1) + all.length) % all.length].focus();
    }
  });
  $('#shutBtn').addEventListener('click', () => { close(); Shutdown.show(); });
  return { close };
})();

/* ═════════ shutdown / power on ═════════ */
const Shutdown = (() => {
  const s = $('#shutdown');
  const wake = () => { if (s.hidden) return; s.hidden = true; log.replaceChildren(); state.cwd = ''; ps1.textContent = promptText(); Win.open().then(boot); };
  s.addEventListener('click', wake);
  document.addEventListener('keydown', (e) => { if (!s.hidden) { e.preventDefault(); wake(); } }, true);
  return { show: () => { s.hidden = false; s.focus?.(); } };
})();

/* ═════════ clock (real local time) ═════════ */
(function tick() {
  const now = new Date();
  $('#clock').textContent = now.toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit' });
  $('#clock').dateTime = now.toISOString();
  setTimeout(tick, 60000 - (now.getSeconds() * 1000 + now.getMilliseconds()));
})();

/* ═════════ boot ═════════ */
async function boot() {
  const b = h('div', 'boot');
  b.append(frag(`<p class="w">ArtiOS 98 [Versión 4.10.1998]</p><p>(C) Arti Gallardo ${new Date().getFullYear()}.</p><div class="blank"></div><p>Escribe ${btn('help', 'AYUDA')} o haz doble clic en un icono del escritorio.</p>`));
  log.append(b);
  renderMirror();
  if (!mobile()) input.focus({ preventScroll: true });
  if (!reduce) await sleep(600);
  await typeAndRun('whoami');
}
document.fonts.ready.then(boot);
</script>
