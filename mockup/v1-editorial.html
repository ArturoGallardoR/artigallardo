<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arti Gallardo — terminal</title>
<meta name="description" content="Arti Gallardo · IT & Automation Engineer / AI Systems. Portafolio en formato terminal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Geist:wght@200;300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ag-font-display: "GFS Didot", "Bodoni Moda", "Instrument Serif", serif;
  --ag-font-sans: "Geist", "Geist Sans", "Inter Display", Inter, system-ui, sans-serif;
  --ag-font-mono: "Geist Mono", "IBM Plex Mono", "JetBrains Mono", ui-monospace, monospace;

  --ag-black: #08090A;
  --ag-carbon: #0E1012;
  --ag-graphite: #1B1E21;
  --ag-steel: #737A82;
  --ag-concrete: #B8BEC5;
  --ag-paper: #F1F2F0;
  --ag-cyan: #31E6E6;
  --ag-teal: #1CB5A3;
  --ag-violet: #6D4CFF;
  --ag-border: #34383D;
  --ag-accent: var(--ag-cyan);

  /* steel #737A82 on carbon = 4.3:1, too low for small text → lifted meta tone */
  --meta: #8C939B;
  --ag-fast: 180ms;
  --ag-standard: 320ms;
  --ag-ease: cubic-bezier(.2,.75,.2,1);

  --rail: 236px;
  --side: 44px;
  --bar: 44px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
html { background: var(--ag-black); color: var(--ag-paper); color-scheme: dark; }
body {
  margin: 0;
  font-family: var(--ag-font-sans);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
::selection { background: color-mix(in srgb, var(--ag-accent) 22%, transparent); color: var(--ag-paper); }
:focus-visible { outline: 1px solid var(--ag-accent); outline-offset: 4px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.mono { font-family: var(--ag-font-mono); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ───────── frame ───────── */
.frame {
  position: fixed; inset: 16px;
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr) var(--side);
  grid-template-rows: var(--bar) minmax(0, 1fr) var(--bar);
  border: 1px solid var(--ag-border);
}
.cross { position: absolute; width: 13px; height: 13px; pointer-events: none; }
.cross::before, .cross::after { content: ""; position: absolute; background: var(--ag-concrete); }
.cross::before { left: 6px; top: 0; width: 1px; height: 13px; }
.cross::after { top: 6px; left: 0; height: 1px; width: 13px; }
.cross.tl { left: -7px; top: -7px; } .cross.tr { right: -7px; top: -7px; }
.cross.bl { left: -7px; bottom: -7px; } .cross.br { right: -7px; bottom: -7px; }

.bar {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 0;
  font-family: var(--ag-font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ag-concrete);
}
.bar > * { padding: 0 18px; height: 100%; display: flex; align-items: center; gap: 18px; }
.bar > * + * { border-left: 1px solid var(--ag-border); }
.bar .grow { flex: 1; }
.top { border-bottom: 1px solid var(--ag-border); }
.bottom { border-top: 1px solid var(--ag-border); grid-row: 3; color: var(--meta); letter-spacing: .1em; }
.top .name { color: var(--ag-paper); width: var(--rail); }
kbd {
  font-family: var(--ag-font-mono); font-size: 10px; letter-spacing: .08em;
  border: 1px solid var(--ag-border); padding: 1px 6px; color: var(--ag-concrete); margin-right: 6px;
}

/* ───────── rail ───────── */
.rail {
  grid-row: 2; border-right: 1px solid var(--ag-border);
  display: flex; flex-direction: column; min-height: 0;
}
.rail-head {
  padding: 22px 20px 14px; font-family: var(--ag-font-mono); font-size: 11px; letter-spacing: .14em;
  color: var(--meta); text-transform: uppercase; border-bottom: 1px solid var(--ag-border);
}
.rail ul { list-style: none; margin: 0; padding: 8px 0; overflow: auto; }
.rail li button {
  position: relative; width: 100%;
  display: grid; grid-template-columns: 14px 1fr; column-gap: 8px;
  padding: 11px 20px 11px 18px;
  transition: background var(--ag-fast) var(--ag-ease);
}
.rail li button:hover { background: var(--ag-carbon); }
.rail .dot {
  width: 5px; height: 5px; margin-top: 8px; border: 1px solid var(--ag-border);
  transition: background var(--ag-fast) var(--ag-ease), border-color var(--ag-fast) var(--ag-ease);
}
.rail .cmd { font-family: var(--ag-font-mono); font-size: 14px; color: var(--ag-concrete); transition: color var(--ag-fast) var(--ag-ease); }
.rail .desc { grid-column: 2; font-size: 13px; color: var(--meta); line-height: 1.3; }
.rail li button:hover .cmd { color: var(--ag-paper); }
.rail li button:hover .dot { border-color: var(--ag-teal); }
.rail li button[aria-current="true"] .cmd { color: var(--ag-paper); }
.rail li button[aria-current="true"] .dot { background: var(--ag-accent); border-color: var(--ag-accent); }
.rail-foot {
  margin-top: auto; padding: 18px 20px; border-top: 1px solid var(--ag-border);
  font-family: var(--ag-font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--meta); line-height: 1.8;
}

/* ───────── side rail ───────── */
.side {
  grid-row: 2; border-left: 1px solid var(--ag-border);
  display: flex; align-items: center; justify-content: center;
}
.side span {
  writing-mode: vertical-rl; font-family: var(--ag-font-mono); font-size: 11px;
  letter-spacing: .2em; text-transform: uppercase; color: var(--meta); white-space: nowrap;
}

/* ───────── terminal ───────── */
.term {
  grid-row: 2; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  background: var(--ag-carbon);
  padding: 28px clamp(20px, 4vw, 56px) 40vh;
  scroll-padding-top: 24px;
  cursor: text;
  scrollbar-width: thin; scrollbar-color: var(--ag-border) transparent;
}
.term::-webkit-scrollbar { width: 8px; }
.term::-webkit-scrollbar-thumb { background: var(--ag-border); }
.term-inner { max-width: 1040px; }

.line, .cmdline, .prompt-line {
  font-family: var(--ag-font-mono); font-size: 14px; line-height: 1.7;
}
.line { color: var(--meta); }
.ps1 { color: var(--ag-concrete); white-space: nowrap; }
.ps1 .host { color: var(--meta); }
.ps1 .sigil { color: var(--ag-paper); }
.cmdline { display: flex; gap: 10px; color: var(--ag-paper); }
.entry { padding: 18px 0 30px; }
.entry + .entry { border-top: 1px solid var(--ag-graphite); }
.out { margin-top: 14px; cursor: auto; }

.prompt-line { display: flex; gap: 10px; align-items: baseline; padding-top: 18px; border-top: 1px solid var(--ag-graphite); }
.field { position: relative; flex: 1; min-width: 0; }
.field input {
  position: absolute; inset: 0; width: 100%; opacity: 0;
  font: inherit; font-size: 16px; /* ≥16px stops iOS zoom */
  border: 0; padding: 0; margin: 0; background: transparent; color: transparent;
}
.mirror { white-space: pre; color: var(--ag-paper); pointer-events: none; overflow: hidden; display: block; }
.caret {
  display: inline-block; min-width: 1ch;
  outline: 1px solid var(--ag-concrete); outline-offset: -1px; color: var(--ag-paper);
}
.field.focused .caret { background: var(--ag-accent); outline-color: var(--ag-accent); color: var(--ag-black); }

/* ───────── output typography ───────── */
.display {
  font-family: var(--ag-font-display); font-weight: 400;
  font-size: clamp(56px, 8.4vw, 112px); line-height: .9; letter-spacing: -.02em;
  margin: 0; text-transform: uppercase;
}
.h2 {
  font-family: var(--ag-font-display); font-weight: 400;
  font-size: clamp(34px, 4.4vw, 60px); line-height: 1.02; letter-spacing: -.015em;
  margin: 0; text-wrap: balance; max-width: 18ch;
}
.support {
  font-weight: 200; font-size: clamp(20px, 2.2vw, 30px); line-height: 1.25; letter-spacing: .005em;
  color: var(--ag-paper); margin: 0; max-width: 26ch; text-wrap: balance;
}
.tracked {
  font-weight: 300; font-size: clamp(13px, 1.25vw, 17px); letter-spacing: .32em; text-transform: uppercase;
  color: var(--ag-concrete); margin: 0;
}
.prose { color: var(--ag-concrete); max-width: 62ch; margin: 0; }
.meta { font-family: var(--ag-font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--meta); }
.todo {
  color: var(--meta); font-family: var(--ag-font-mono); font-size: .88em;
  border-bottom: 1px dashed var(--ag-border);
}

/* links that run commands */
.run {
  position: relative; font-family: var(--ag-font-mono); font-size: 14px; color: var(--ag-paper);
  transition: color var(--ag-fast) var(--ag-ease);
}
.run::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 1px; background: var(--ag-accent);
  transform: scaleX(0); transform-origin: left; transition: transform var(--ag-fast) var(--ag-ease);
}
.run:hover { color: var(--ag-accent); }
.run:hover::after, .run:focus-visible::after { transform: scaleX(1); }
.run .arrow { color: var(--meta); margin-right: 8px; }
.next { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 30px; }

/* whoami hero */
.hero { display: grid; grid-template-columns: 7fr 5fr; gap: 0; border: 1px solid var(--ag-border); background: var(--ag-black); }
.hero-copy { padding: clamp(24px, 3vw, 40px); display: flex; flex-direction: column; gap: 22px; border-right: 1px solid var(--ag-border); }
.hero-copy .tracked { padding-top: 18px; border-top: 1px solid var(--ag-border); }
.hero-view { position: relative; min-height: 340px; }
.hero-view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hero-view .cap { position: absolute; left: 14px; bottom: 12px; right: 14px; display: flex; justify-content: space-between; }
.hero-meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--ag-border); border-top: 0; }
.hero-meta > div { padding: 14px 18px; line-height: 1.7; }
.hero-meta > div + div { border-left: 1px solid var(--ag-border); }
.hero-meta .meta { color: var(--ag-concrete); }

/* rows: experience / education */
.rows { border-top: 1px solid var(--ag-border); }
.row { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 24px; padding: 22px 0; border-bottom: 1px solid var(--ag-border); }
.row h3 { margin: 0; font-weight: 500; font-size: 18px; letter-spacing: -.005em; }
.row .org { color: var(--ag-concrete); font-weight: 300; }
.row ul { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; max-width: 66ch; }
.row li { color: var(--ag-concrete); padding-left: 20px; position: relative; }
.row li::before { content: "—"; position: absolute; left: 0; color: var(--ag-border); }
.row li b { color: var(--ag-paper); font-weight: 500; }

/* projects table */
.ls-head, .ls-row { display: grid; grid-template-columns: 170px minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, .9fr); gap: 20px; align-items: baseline; }
.ls-head { padding: 0 12px 10px; border-bottom: 1px solid var(--ag-border); }
.ls-row {
  width: 100%; padding: 16px 12px; border-bottom: 1px solid var(--ag-graphite);
  transition: background var(--ag-fast) var(--ag-ease);
}
.ls-row:hover { background: var(--ag-graphite); }
.ls-row .slug { font-family: var(--ag-font-mono); font-size: 13px; color: var(--meta); transition: color var(--ag-fast) var(--ag-ease); }
.ls-row:hover .slug { color: var(--ag-accent); }
.ls-row .t { font-weight: 500; }
.ls-row .r { font-family: var(--ag-font-display); font-size: 21px; line-height: 1.15; }
.ls-row .s { font-family: var(--ag-font-mono); font-size: 12px; color: var(--meta); }

/* case */
.case-top { display: grid; grid-template-columns: 7fr 5fr; gap: 40px; align-items: end; padding-bottom: 26px; border-bottom: 1px solid var(--ag-border); }
.case-id { margin-top: 18px; display: flex; gap: 18px; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: 180px minmax(0, 1fr); max-width: 940px; }
.kv > dt, .kv > dd { margin: 0; padding: 16px 0; border-bottom: 1px solid var(--ag-graphite); }
.kv > dt { padding-top: 19px; }
.kv > dd { color: var(--ag-concrete); padding-right: 24px; }

/* skills */
.skills dd { color: var(--ag-paper); }
.skills .sep { color: var(--ag-border); margin: 0 .5em; }
.comment { font-family: var(--ag-font-mono); font-size: 13px; color: var(--meta); margin: 22px 0 0; }

/* about */
.duo { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--ag-border); margin-top: 28px; }
.duo > div { padding: 24px 26px; }
.duo > div + div { border-left: 1px solid var(--ag-border); }
.duo ul { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 6px; font-weight: 300; font-size: 20px; }

/* help */
.help { display: grid; grid-template-columns: 220px minmax(0, 1fr); row-gap: 4px; font-family: var(--ag-font-mono); font-size: 14px; }
.help .d { color: var(--ag-concrete); font-family: var(--ag-font-sans); font-size: 15px; }
.err { color: var(--ag-paper); }
.err .x { color: var(--ag-violet); }

/* staged reveal for fresh output */
.reveal > * { animation: rise var(--ag-standard) var(--ag-ease) both; }
.reveal > *:nth-child(2) { animation-delay: 60ms; }
.reveal > *:nth-child(3) { animation-delay: 120ms; }
.reveal > *:nth-child(n+4) { animation-delay: 180ms; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); clip-path: inset(0 0 30% 0); } to { opacity: 1; transform: none; clip-path: inset(0 0 0 0); } }

/* mobile command dock */
.dock { display: none; }

@media (max-width: 1100px) {
  :root { --rail: 200px; }
  .hero { grid-template-columns: 1fr; }
  .hero-copy { border-right: 0; border-bottom: 1px solid var(--ag-border); }
  .hero-view { min-height: 260px; }
  .case-top { grid-template-columns: 1fr; gap: 20px; }
  .ls-head, .ls-row { grid-template-columns: 150px minmax(0, 1fr) minmax(0, 1fr); }
  .ls-head .hs, .ls-row .s { display: none; }
}
@media (max-width: 820px) {
  .frame { inset: 0; border: 0; grid-template-columns: minmax(0, 1fr); grid-template-rows: var(--bar) minmax(0, 1fr) auto; }
  .cross, .rail, .side, .bottom, .top .role, .top .tag { display: none; }
  .top .name { width: auto; }
  .term { grid-column: 1; padding: 20px 18px 30vh; }
  .dock {
    display: flex; grid-row: 3; gap: 0; overflow-x: auto; border-top: 1px solid var(--ag-border);
    background: var(--ag-black); scrollbar-width: none;
  }
  .dock button {
    flex: 0 0 auto; padding: 14px 16px; min-height: 48px;
    font-family: var(--ag-font-mono); font-size: 13px; color: var(--ag-concrete);
  }
  .dock button + button { border-left: 1px solid var(--ag-border); }
  .dock button[aria-current="true"] { color: var(--ag-paper); box-shadow: inset 0 -1px 0 var(--ag-accent); }
  .hero-meta { grid-template-columns: 1fr; }
  .hero-meta > div + div { border-left: 0; border-top: 1px solid var(--ag-border); }
  .row, .kv, .help { grid-template-columns: 1fr; gap: 6px; }
  .kv > dt { border-bottom: 0; padding-bottom: 0; }
  .ls-head { display: none; }
  .ls-row { grid-template-columns: 1fr; gap: 4px; }
  .duo { grid-template-columns: 1fr; }
  .duo > div + div { border-left: 0; border-top: 1px solid var(--ag-border); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div class="frame">
  <i class="cross tl"></i><i class="cross tr"></i><i class="cross bl"></i><i class="cross br"></i>

  <header class="bar top">
    <span class="name">Arti Gallardo</span>
    <span class="role grow">IT &amp; Automation Engineer / AI Systems</span>
    <span class="tag">Portafolio · mockup</span>
  </header>

  <nav class="rail" aria-label="Comandos">
    <div class="rail-head">Comandos</div>
    <ul id="rail"></ul>
    <div class="rail-foot">Useful intelligence.<br>Human judgment.</div>
  </nav>

  <main class="term" id="term" aria-label="Terminal">
    <div class="term-inner">
      <div id="log" role="log" aria-live="polite" aria-relevant="additions"></div>
      <div class="prompt-line" id="promptLine">
        <label for="cmd" class="ps1"><span>arti</span><span class="host">@gallardo</span><span class="sigil">:~$</span></label>
        <div class="field" id="field">
          <input id="cmd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-describedby="hint">
          <span class="mirror" id="mirror" aria-hidden="true"></span>
        </div>
      </div>
    </div>
  </main>

  <aside class="side" aria-hidden="true"><span>Systems that earn their complexity</span></aside>

  <footer class="bar bottom" id="hint">
    <span><span><kbd>Tab</kbd>autocompletar</span><span><kbd>↑ ↓</kbd>historial</span><span><kbd>Ctrl L</kbd>limpiar</span><span><kbd>Esc</kbd>saltar animación</span></span>
    <span class="grow"></span>
    <span>escribe help</span>
  </footer>

  <nav class="dock" id="dock" aria-label="Comandos rápidos"></nav>
</div>

<script>
/* ═════════ data: facts from canonical CV notes; [brackets] = pending from CV ═════════ */
const TODO = (t) => `<span class="todo">[${t}]</span>`;

const EXPERIENCE = [

      'Desplegué <b>n8n self-hosted</b> con Docker Compose como plataforma principal de automatización interna: Google Workspace, Odoo, Cloudflare y servicios de IA.',

      'Automaticé la prospección LinkedIn → Odoo: de <b>~4 horas a ~8 segundos por lead</b>.',
      'Configuré Fireflies.ai para resumir ~30 reuniones al mes con <b>una sola licencia</b>.',
    ],
  },
  {
    period: TODO('20XX — 20XX'),
    role: TODO('puesto'),
    org: 'Toka Internacional',
    points: [
      '<b>96% de cumplimiento de SLA</b> reportado.',
      'Cerca de los primeros lugares del equipo por tickets resueltos con éxito.',
    ],
  },
  {
    period: TODO('20XX — 20XX'),
    role: TODO('puesto'),
    org: 'Asia Robótica',
    points: [
      'Lideré la migración a <b>Synology NAS</b>: ~20% menos consumo eléctrico asociado a hardware antiguo de alto consumo.',
    ],
  },
];

const PROJECTS = [
  { slug: 'linkedin-odoo', title: 'Prospección LinkedIn → Odoo', result: '~4 h → ~8 s por lead.',
    stack: 'Tampermonkey · n8n · Odoo CRM · IA',
    context: 'Capturar prospectos de LinkedIn y darlos de alta en el CRM era manual, unas 4 horas para un volumen típico de 10–20 leads por semana.',
    decision: 'Captura en el navegador con Tampermonkey, limpieza de datos con IA y alta automática en Odoo vía n8n. La IA sólo entra donde el dato es desordenado; el resto son reglas.',

    tradeoff: TODO('tradeoff — del CV'), },
  { slug: 'odoo-mcp', title: 'Odoo MCP', result: 'Asistentes de IA con datos vivos del ERP.',
    stack: 'MCP · Odoo · Node.js',
    context: 'Los asistentes de IA no tenían acceso a la información real del negocio en ERP/CRM.',
    decision: 'Servidor Model Context Protocol propio para Odoo, para consultar datos de ERP/CRM en tiempo real.',
    tradeoff: TODO('alcance / permisos — del CV'), },
  { slug: 'incidencias-rh', title: 'Flujo de incidencias de RH', result: 'Piloto con ~15 líderes.',
    stack: 'n8n Forms · Cloudflare Access · Sheets',
    context: 'Registrar incidencias de personal de forma controlada, sólo por líderes.',
    decision: 'Formularios en n8n detrás de Cloudflare Access: acceso sólo para líderes, detección automática del usuario y sincronización de empleados desde Google Sheets.',
    tradeoff: TODO('resultado del piloto — del CV'), },
  { slug: 'endpoints', title: 'Gestión de endpoints', result: '~100 equipos bajo 5 políticas.',
    stack: 'NinjaOne · macOS · Windows · iOS',
    context: 'Parque mixto de ~80 Mac, ~20 Windows y iPhone sin gestión centralizada.',
    decision: 'Selección y despliegue de NinjaOne con 5 políticas de gestión; ITAM negociado casi sin costo adicional.',
    tradeoff: TODO('criterio de selección vs alternativas — del CV'), },
];

const SKILLS = [
  ['Automatización', ['n8n (self-hosted)', 'n8n Forms', 'Tampermonkey', 'Google Workspace', 'APIs']],
  ['IA aplicada', ['MCP', 'Agentes de IA', 'Flujos con contexto aumentado', 'Claude Code', 'OpenCode', 'Orca', 'StageWise']],

/* ═════════ terminal engine ═════════ */
const $ = (s) => document.querySelector(s);
const term = $('#term'), log = $('#log'), input = $('#cmd'), mirror = $('#mirror'), field = $('#field');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const state = { history: [], hIdx: 0, busy: false, skip: false, draft: '' };
const ALL = [...Object.keys(COMMANDS), 'clear'];
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const PS1 = `<span class="ps1"><span>arti</span><span class="host">@gallardo</span><span class="sigil">:~$</span></span>`;

/* Static, author-controlled templates only. Any user-typed text is passed through esc() or set via textContent. */
function setStatic(el, html) { el.replaceChildren(document.createRange().createContextualFragment(html)); }
function h(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

function buildNav() {
  $('#rail').replaceChildren(...NAV.map(([c, d]) => {
    const li = h('li'), b = h('button');
    b.dataset.cmd = c; b.dataset.nav = c;
    b.append(h('span', 'dot'), h('span', 'cmd', c), h('span', 'desc', d));
    li.append(b); return li;
  }));
  $('#dock').replaceChildren(...NAV.map(([c]) => { const b = h('button', null, c); b.dataset.cmd = c; b.dataset.nav = c; return b; }));
}
function setActive(name) {
  document.querySelectorAll('[data-nav]').forEach(b => b.setAttribute('aria-current', String(b.dataset.nav === name)));
}

function renderMirror() {
  const v = input.value, pos = input.selectionStart ?? v.length;
  mirror.replaceChildren(document.createTextNode(v.slice(0, pos)), h('span', 'caret', v[pos] || '\u00a0'), document.createTextNode(v.slice(pos + 1)));
}

function closest(word) {
  const d = (a, b) => { const m = Array.from({ length: a.length + 1 }, (_, i) => [i]); for (let j = 1; j <= b.length; j++) m[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) m[i][j] = Math.min(m[i-1][j] + 1, m[i][j-1] + 1, m[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)); return m[a.length][b.length]; };
  const best = ALL.map(c => [c, d(word, c)]).sort((a, b) => a[1] - b[1])[0];
  return best && best[1] <= 3 ? best[0] : null;
}

function print(cmdText, html, { reveal = true } = {}) {
  const entry = document.createElement('section');
  entry.className = 'entry';
  const line = h('div', 'cmdline');
  setStatic(line, PS1);
  line.append(h('span', null, cmdText));
  entry.append(line);
  if (html) { const out = h('div', reveal ? 'out reveal' : 'out'); setStatic(out, html); entry.append(out); }
  log.appendChild(entry);
  return entry;
}

function execute(raw) {
  const text = raw.trim();
  if (text) { state.history.push(text); }
  state.hIdx = state.history.length;
  if (!text) { print('', ''); return; }

  const [head, ...args] = text.split(/\s+/);
  const name = ALIASES[head.toLowerCase()] || head.toLowerCase();

  if (name === 'clear') { log.innerHTML = ''; setActive(null); return; }

  let html;
  if (COMMANDS[name]) html = COMMANDS[name](args);
  else {
    const guess = closest(name);
    html = `<p class="err"><span class="x">✕</span> comando no encontrado: <span class="mono">${esc(head)}</span></p>` +
      (guess ? next([guess, `¿quisiste decir ${guess}?`]) : next(['help', 'ver comandos disponibles']));
  }
  const entry = print(text, html);
  setActive(NAV.some(([c]) => c === name) ? name : name === 'open' ? 'projects' : null);
  entry.querySelectorAll('canvas[data-corridor]').forEach(Corridor.add);
  const top = entry.getBoundingClientRect().top - term.getBoundingClientRect().top + term.scrollTop - 4;
  term.scrollTo({ top, behavior: reduce ? 'auto' : 'smooth' });
}

async function typeAndRun(cmd) {
  if (state.busy) return;
  state.busy = true; state.skip = false;
  input.value = '';
  for (const ch of cmd) {
    input.value += ch; input.setSelectionRange(input.value.length, input.value.length); renderMirror();
    if (!reduce && !state.skip) await sleep(22 + Math.random() * 28);
  }
  if (!reduce && !state.skip) await sleep(120);
  execute(cmd);
  input.value = ''; renderMirror();
  state.busy = false;
}

function complete() {
  const v = input.value;
  const pool = v.startsWith('open ') ? PROJECTS.map(p => 'open ' + p.slug) : ALL;
  const hits = pool.filter(c => c.startsWith(v.toLowerCase()));
  if (hits.length === 1) input.value = hits[0] + (hits[0] === 'open' ? ' ' : '');
  else if (hits.length > 1) {
    const prefix = hits.reduce((a, b) => { let i = 0; while (i < a.length && a[i] === b[i]) i++; return a.slice(0, i); });
    if (prefix.length > v.length) input.value = prefix;
    else print(v, `<p class="line">${hits.map(h => `<button class="run" data-cmd="${h}" style="margin-right:22px">${h.replace('open ', '')}</button>`).join('')}</p>`, { reveal: false });
  }
  input.setSelectionRange(input.value.length, input.value.length);
  renderMirror();
}

/* input events */
input.addEventListener('keydown', (e) => {
  if (state.busy) { if (e.key === 'Escape') state.skip = true; e.preventDefault(); return; }
  if (e.key === 'Enter') { e.preventDefault(); const v = input.value; input.value = ''; execute(v); renderMirror(); }
  else if (e.key === 'Tab') { e.preventDefault(); complete(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (state.hIdx === state.history.length) state.draft = input.value; if (state.hIdx > 0) input.value = state.history[--state.hIdx]; renderMirror(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); if (state.hIdx < state.history.length) { state.hIdx++; input.value = state.history[state.hIdx] ?? state.draft; } renderMirror(); }
  else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); execute('clear'); }
  requestAnimationFrame(renderMirror);
});
['input', 'select', 'click', 'keyup'].forEach(ev => input.addEventListener(ev, renderMirror));
input.addEventListener('focus', () => field.classList.add('focused'));
input.addEventListener('blur', () => field.classList.remove('focused'));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') state.skip = true; });

/* mouse: any [data-cmd] runs; clicking empty terminal focuses prompt */
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-cmd]');
  if (btn) { typeAndRun(btn.dataset.cmd); input.focus({ preventScroll: true }); return; }
  if (e.target.closest('.term') && !String(getSelection()).length && !e.target.closest('a,button')) input.focus({ preventScroll: true });
});

/* ═════════ corridor: one-point perspective, slow drift, pointer-biased vanishing point ═════════ */
const Corridor = (() => {
  const items = new Set();
  let raf = 0;
  const io = new IntersectionObserver(es => es.forEach(en => { en.target._visible = en.isIntersecting; }), { root: term });

  function add(cv) {
    cv._visible = true; cv._mx = 0; cv._my = 0; cv._tx = 0; cv._ty = 0;
    const host = cv.parentElement;
    host.addEventListener('pointermove', (e) => { const r = host.getBoundingClientRect(); cv._tx = (e.clientX - r.left) / r.width - .5; cv._ty = (e.clientY - r.top) / r.height - .5; });
    host.addEventListener('pointerleave', () => { cv._tx = 0; cv._ty = 0; });
    // only the newest corridor animates; older ones freeze
    items.forEach(c => { c._frozen = true; });
    items.add(cv); io.observe(cv);
    if (reduce) draw(cv, 0); else if (!raf) raf = requestAnimationFrame(loop);
  }

  function draw(cv, t) {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    cv._mx += (cv._tx - cv._mx) * .04; cv._my += (cv._ty - cv._my) * .04;
    const vx = w * (.5 + cv._mx * .12), vy = h * (.46 + cv._my * .1);
    const L = 0, T = 0, R = w, B = h;
    const at = (s) => [vx + (L - vx) * s, vy + (T - vy) * s, vx + (R - vx) * s, vy + (B - vy) * s];

    // portal glow
    const g = ctx.createRadialGradient(vx, vy, 0, vx, vy, Math.min(w, h) * .32);
    g.addColorStop(0, 'rgba(241,242,240,.30)'); g.addColorStop(.25, 'rgba(241,242,240,.06)'); g.addColorStop(1, 'rgba(241,242,240,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

    ctx.lineWidth = 1;
    // depth frames moving toward the viewer
    const N = 11, phase = reduce ? .35 : (t / 3200) % 1;
    for (let i = 0; i < N; i++) {
      const d = N - i - phase;               // distance index
      const s = 1 / (1 + d * .62);
      const [x0, y0, x1, y1] = at(s);
      ctx.strokeStyle = `rgba(241,242,240,${(.08 + s * .5).toFixed(3)})`;
      ctx.strokeRect(Math.round(x0) + .5, Math.round(y0) + .5, Math.round(x1 - x0), Math.round(y1 - y0));
    }
    // rays: corners + floor/ceiling grid
    ctx.strokeStyle = 'rgba(241,242,240,.22)';
    ctx.beginPath();
    const cols = 6;
    for (let k = 0; k <= cols; k++) {
      const x = L + (R - L) * k / cols;
      ctx.moveTo(x, B); ctx.lineTo(vx, vy);
      ctx.moveTo(x, T); ctx.lineTo(vx, vy);
    }
    ctx.moveTo(L, vy * .55 + T * .45); ctx.lineTo(vx, vy);
    ctx.moveTo(R, vy * .55 + T * .45); ctx.lineTo(vx, vy);
    ctx.stroke();

    // portal + single signal point
    const [px0, py0, px1, py1] = at(.045);
    ctx.fillStyle = 'rgba(241,242,240,.92)';
    ctx.fillRect(px0, py0, px1 - px0, py1 - py0);
    ctx.fillStyle = '#31E6E6';
    ctx.beginPath(); ctx.arc(vx, py1 + 10, 2.5, 0, Math.PI * 2); ctx.fill();
  }

  function loop(t) {
    let live = false;
    items.forEach(cv => {
      if (!cv.isConnected) { items.delete(cv); io.unobserve(cv); return; }
      if (cv._frozen) return;
      live = true;
      if (cv._visible) draw(cv, t);
    });
    raf = live ? requestAnimationFrame(loop) : 0;
  }
  addEventListener('resize', () => items.forEach(cv => draw(cv, performance.now())));
  return { add };
})();

/* ═════════ boot ═════════ */
buildNav();
renderMirror();
(async () => {
  const now = new Date().toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' });
  const l = document.createElement('p');
  l.className = 'line'; l.style.margin = '0';
  const helpBtn = h('button', 'run', 'help'); helpBtn.dataset.cmd = 'help';
  l.append(`Último acceso: ${now} · escribe `, helpBtn, ' o elige un comando del panel.');
  log.appendChild(l);
  input.focus({ preventScroll: true });
  if (!reduce) await sleep(450);
  await typeAndRun('whoami');
})();
